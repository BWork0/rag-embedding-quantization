[project]
name = "rag-embedding-quantization"
version = "0.1.0"
description = "Retrieval quality vs. size/speed when quantizing a RAG embedding model"
requires-python = ">=3.13"
dependencies = [
    "fastembed>=0.9.0",
    "huggingface-hub>=1.33.0",
    "numpy>=2.5.4",
]

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
onnx = [
    "onnx>=1.23.2",
]
plot = [
    "matplotlib>=3.11.2",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
